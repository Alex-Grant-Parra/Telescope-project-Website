{% extends "base.html" %}

{% block title %}Support{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card mb-4">
      <div class="card-body">
        <h1 class="h3 mb-3">Support</h1>
        <p class="text-muted">Welcome to the support center. Choose an option below.</p>
        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-outline-primary" href="{{ url_for('contact.contact_form') }}">
            <i class="fa-regular fa-envelope me-1"></i> Contact Us
          </a>
          <a class="btn btn-outline-secondary" href="{{ url_for('contact.support_tickets') }}">
            <i class="fa-solid fa-list-check me-1"></i> View Your Tickets
          </a>
          {% if current_user.is_authenticated and current_user.is_admin %}
          <a class="btn btn-outline-warning ms-auto" href="{{ url_for('contact.admin_contact_list') }}">
            <i class="fa-solid fa-inbox me-1"></i> Admin Inbox
          </a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
