{% extends "base.html" %}

{% block title %}404 Page Not Found - Telescope Control{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow">
                <div class="card-body">
                    <h1 class="display-1 text-warning">404</h1>
                    <h2 class="card-title">Page Not Found</h2>
                    <p class="card-text lead">Oops! The page you're looking for could not be found.</p>
                    <p class="card-text text-muted">
                        Here's a photo of Bob the cat to make you feel better...
                    </p>
                    
                    <!-- Image displayed in the card -->
                    <div class="my-4">
                        <img src="{{ url_for('static', filename='404cat.webp') }}" 
                             alt="Bob the cat" 
                             class="img-fluid rounded" 
                             style="max-width: 400px; width: 80%;">
                    </div>
                    
                    <div class="mt-4">
                        <a href="{{ url_for('home.home') }}" class="btn btn-primary me-2">
                            <i class="fas fa-home"></i> Go to Homepage
                        </a>
                        <button class="btn btn-outline-secondary" onclick="history.back()">
                            <i class="fas fa-arrow-left"></i> Go Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
